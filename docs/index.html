<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충전기 상태 모니터링 데모</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
</head>
<body>
  <header>
    <h1>전기차 충전기 실시간 상태</h1>
    <p id="conn-status">서버 연결 중...</p>
  </header>
  <div class="search-bar">
    <input id="search-input" type="text" placeholder="지점 이름이나 주소로 검색" autocomplete="off">
  </div>
  <div id="map"></div>

  <div class="admin-panel">
    <button id="admin-toggle" type="button" class="admin-toggle-btn">+ 충전기 추가</button>
    <form id="add-charger-form" class="admin-form" hidden>
      <fieldset id="af-unassigned-box" class="admin-unassigned" hidden>
        <legend>접속했지만 지점이 없는 단말</legend>
        <div id="af-unassigned"></div>
      </fieldset>
      <input id="af-id" type="text" placeholder="미리 등록할 충전기 ID (선택, 예: CP-7)" autocomplete="off">
      <input id="af-vendor" type="text" placeholder="제조사 (선택, 비우면 DemoVendor)" autocomplete="off">
      <input id="af-model" type="text" placeholder="모델 (선택, 비우면 DC-50kW)" autocomplete="off">

      <div class="admin-site-mode">
        <label><input type="radio" name="site-mode" value="existing" checked> 기존 지점에 추가</label>
        <label><input type="radio" name="site-mode" value="new"> 새 지점 만들기</label>
      </div>

      <select id="af-site-select"></select>

      <div id="af-new-site-fields" hidden>
        <input id="af-site-address" type="text" placeholder="주소 (예: 서울 강남구 강남대로 396)" autocomplete="off">
        <p class="admin-hint">지점 이름은 주소의 도로명+건물번호로 자동으로 붙고, 위도·경도도 자동으로 찾아요. 이 주소에 미리 등록된 충전기가 있으면 같이 추가돼요.</p>
      </div>

      <button type="submit" class="btn btn-ok">추가</button>
      <p id="af-status" class="admin-status"></p>
    </form>
  </div>

  <main id="cards"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
